
name: Website Keep Alive

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-websites:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping all websites
        shell: bash
        run: |
          urls=(
            "https://codespace-1-6xev.onrender.com"
          )

          for url in "${urls[@]}"; do
            echo "Checking: $url"

            if curl -sS -L -o /dev/null \
              --connect-timeout 10 \
              --max-time 30 \
              -w "HTTP Status: %{http_code} | Response: %{time_total}s\n" \
              "$url"; then
              echo "Request completed"
            else
              echo "FAILED: $url"
            fi

            echo "----------------------"
          done
